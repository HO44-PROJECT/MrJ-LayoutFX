# Builds the ESP32 firmware and publishes the browser USB flasher (ESP Web Tools)
# to GitHub Pages — a WLED-style "install from a web page" experience.
#
# One-time setup before this runs green:
#   Repo Settings → Pages → Source = "GitHub Actions".
name: Web installer

on:
  push:
    tags: ['v*']        # publish on every version tag
  workflow_dispatch: {} # …or run it by hand

permissions:
  contents: write
  pages: write
  id-token: write

# Only the latest run for a ref needs to publish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Deliberately WiFi-agnostic (no configurations/auth/wifi.h) — this
      # binary is published to strangers, so it must never bake in the
      # maintainer's own WiFi credentials. See configurations/web_installer/.
      PIO_ENV: web_installer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e "$PIO_ENV"

      - name: Assemble web-installer/
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python3 scripts/build_web_installer.py --env "$PIO_ENV" --version "${{ github.ref_name }}"
          else
            python3 scripts/build_web_installer.py --env "$PIO_ENV"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-installer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e web_installer

      - name: Assemble web-installer/
        run: python3 scripts/build_web_installer.py --env web_installer --version "${{ github.ref_name }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Install this version

            Most users: **[Install in your browser](https://ho44-project.github.io/MrJ-LayoutFX/)** — Chrome or Edge, ESP32 over USB, no tools to install.

            The `.bin` files and `manifest.json` below are only needed for manual
            flashing with `esptool.py` — see
            [web-installer/README.md § Manual flashing](https://github.com/HO44-PROJECT/MrJ-LayoutFX/blob/main/web-installer/README.md#manual-flashing-advanced-no-browser).
          append_body: true
          generate_release_notes: true
          files: |
            web-installer/bootloader.bin
            web-installer/partitions.bin
            web-installer/boot_app0.bin
            web-installer/app.bin
            web-installer/manifest.json
