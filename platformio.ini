; PlatformIO Project Configuration File
;
;   Each [env] uses build_src_filter to compile the library's own src/ (this
;   repo's implementation) plus one main.cpp from configurations/<name>/ —
;   the profile-specific entry point and feature flags (config.h).
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[dbg]
; Deep debug flags — add ${dbg.build_flags} to any env's build_flags to enable.
build_flags =
    -DCONFIG_HEAP_POISONING_COMPREHENSIVE=1
    -DCONFIG_HEAP_TRACING=1
    -DCONFIG_COMPILER_STACK_CHECK_MODE=ALL
    -DCONFIG_COMPILER_OPTIMIZATION_ASSERTION_LEVEL=2
    -DCORE_DEBUG_LEVEL=3

[esp32]
; Common ESP32 build flags — use ${esp32.build_flags} in env build_flags.
build_flags =
    -DESP32
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra

[esp32_optimized]
; Optimized partition table (types in PROGMEM → minimal LittleFS)
; Use ${esp32_optimized.board_build} in env board_build.
board_build.partitions = partitions_optimized.csv
board_build.filesystem = littlefs

[libs_esp32]
; Standard ESP32 lib set — use ${libs_esp32.lib_deps} in env lib_deps.
lib_deps =
    bxparks/AceRoutine@^1.5.1
    mrrwa/NmraDcc@^2.0.17
    olikraus/U8g2@^2.36.18
    plerup/EspSoftwareSerial@^8.2.0
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit PWM Servo Driver Library@^3.0.0

[libs_avr]
; Standard AVR lib set — use ${libs_avr.lib_deps} in env lib_deps.
lib_deps =
    bxparks/AceRoutine@^1.5.1
    mrrwa/NmraDcc@^2.0.17
    madhephaestus/lx16a-servo@^0.9.3
    olikraus/U8g2@^2.36.18
    featherfly/SoftwareSerial@^1.0

[env]
; Propagate PlatformIO environment name into the firmware as a string macro.
; Visible in the web UI "About" panel as the build environment.
build_flags = -DPIOENV_NAME='"${PIOENV}"'

; Pre-build hook: generate embedded data headers (JSON → PROGMEM)
extra_scripts = pre:tools/build_embedded_data.py
    pre:scripts/name_firmware.py

[esp32_webui_base]
; Shared TEMPLATE for ESP32 + WebUI + JSON config envs (see `extends` below).
; Deliberately NOT an [env:...] section: it never appears in `pio run` and can't
; be built/flashed directly — children pull it in via `extends = esp32_webui_base`.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = ${esp32_optimized.board_build.partitions}
board_build.filesystem = ${esp32_optimized.board_build.filesystem}
; Inherit the global [env] scripts (build_embedded_data) via ${env.extra_scripts}
; — PlatformIO REPLACES this option, it doesn't merge — then add the WebUI-only
; generators on top. This way the base behaves like every other env (it keeps the
; global scripts) instead of silently dropping them.
extra_scripts =
    ${env.extra_scripts}
    pre:tools/build_webui.py
    pre:tools/gen_build_info.py
; Config/source directory — defaults to the env name (configurations/<env>/), but
; decoupled so VARIANT envs (e.g. *_ota) can reuse another env's config by
; overriding custom_cfg instead of duplicating build_src_filter/build_flags.
;
; src_dir is still the default src/ — that's the library's own implementation
; (ApiServer.cpp, WebUI.cpp, ConfigManager.cpp, ...) and must stay included, or
; the link fails with "undefined reference" for every class the library defines.
; Only main.cpp comes from outside src_dir, via the ../configurations/<name>/ path.
custom_cfg = ${PIOENV}
build_src_filter = +<*> +<../configurations/${this.custom_cfg}/>
lib_deps = ${libs_esp32.lib_deps}
build_flags = ${env.build_flags}
    ${esp32.build_flags}
    -I.pio/libdeps/${PIOENV}/
    -include configurations/${this.custom_cfg}/config.h
monitor_filters = esp32_exception_decoder

[env:mrj_layoutfx_full]
; Factory profile — every feature enabled: WiFi/WebUI/OTA, DCC, SPI, I2C,
; UART servo, OLED. (Audio not enabled yet — not functional.)
extends = esp32_webui_base

[env:mrj_layoutfx_mini]
; Factory profile — WiFi/WebUI/OTA + I2C servos + OLED. No DCC, no SPI
; (74HC595) shift-register bus.
extends = esp32_webui_base

[env:web_installer]
; Dedicated env for the public browser USB flasher (web-installer/, ESP Web
; Tools). Deliberately separate from the factory profiles above: this env's
; config.h has no configurations/auth/wifi.h include (the maintainer's own,
; gitignored WiFi credentials) — a firmware that gets built into a binary
; served to strangers from a web page must never carry those. See
; configurations/web_installer/config.h.
extends = esp32_webui_base
